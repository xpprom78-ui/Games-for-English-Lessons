<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest: The Red Leaves of Kyoto</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;color:var(--text);font-family:Manrope,system-ui,sans-serif;
    background-color:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:24px 24px;
  }
  .page{max-width:820px;margin:0 auto;padding:28px 16px 48px 52px;position:relative}
  .page::before{content:"";position:fixed;top:0;bottom:0;left:34px;width:2px;background:var(--margin);opacity:.55}
  header{margin-bottom:18px;position:relative}
  h1{font-family:Caveat,cursive;font-size:54px;line-height:1;margin:0;color:var(--ink);transform:rotate(-1.5deg);transform-origin:left}
  header p{margin:8px 0 0;color:var(--muted);max-width:56ch;position:relative;z-index:1}

  /* маршрут: ворота-тории */
  .track{display:flex;gap:6px;margin:18px 0 10px;position:relative;z-index:1}
  .door{flex:1;text-align:center;font-size:12px;color:var(--muted);padding-top:32px;position:relative}
  .door::before{content:"";position:absolute;top:2px;left:50%;translate:-50% 0;width:26px;height:24px;
    border:3px solid #C9BFAE;border-top-width:5px;border-bottom:none}
  .door::after{content:"";position:absolute;top:10px;left:50%;translate:-50% 0;width:20px;height:3px;background:#C9BFAE}
  .door.now{color:var(--ink);font-weight:800}
  .door.now::before{border-color:var(--ink)}.door.now::after{background:var(--ink)}
  .door.done{color:var(--margin)}
  .door.done::before{border-color:var(--margin)}.door.done::after{background:var(--margin)}

  .inv{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;position:relative;z-index:1}
  .inv span.l{font-size:14px;color:var(--muted)}
  .slot{width:42px;height:50px;display:flex;align-items:center;justify-content:center;
    font:700 32px Caveat,cursive;color:var(--muted);background:#fff;border:2px dashed var(--muted)}
  .slot.got{color:#fff;background:var(--margin);border:2px solid var(--margin);animation:shine .8s}
  @keyframes shine{0%{transform:scale(1.4) rotate(-8deg)}100%{transform:scale(1)}}

  .sheet{background:#fff;border:2px solid var(--text);box-shadow:6px 6px 0 var(--ink);padding:30px 32px 28px;position:relative;z-index:1}
  .seal{position:absolute;top:-16px;right:24px;width:46px;height:46px;background:var(--margin);color:#fff;
    display:flex;align-items:center;justify-content:center;font:700 26px Caveat,cursive;transform:rotate(6deg);
    box-shadow:inset 0 0 0 2px var(--margin),inset 0 0 0 4px #fff}
  h2{font-family:Caveat,cursive;font-size:40px;margin:0 0 10px;line-height:1;color:var(--ink)}
  .story{font-size:18px;line-height:1.6;margin:0 0 6px}
  .ru{font-size:15px;color:var(--muted);line-height:1.55;margin:4px 0 0;display:none}
  .ru.show{display:block}
  .linkbtn{background:none;border:none;padding:0;color:var(--margin);font:600 14px Manrope,sans-serif;text-decoration:underline;cursor:pointer}
  .linkbtn:hover{background:none;color:var(--ink)}
  .task{margin:22px 0 14px;padding:10px 14px;border-left:4px solid var(--margin);background:#FDF0F2;font-weight:600}

  button{font:600 15px Manrope,sans-serif;padding:10px 16px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;border-radius:3px}
  button:hover{background:var(--ink);color:#fff}
  button:focus-visible,input:focus-visible{outline:3px solid var(--margin);outline-offset:2px}
  button.main{background:var(--ink);color:#fff}
  button.main:hover{background:var(--margin);border-color:var(--margin)}
  button:disabled{opacity:.4;cursor:default}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}

  /* объявление с пропусками */
  .note{font-size:18px;line-height:2.1;white-space:pre-line;background:#FFFDF6;padding:16px 20px;border:2px solid var(--grid);
    background-image:repeating-linear-gradient(transparent 0 37px,#EFE6D6 37px 38px)}
  .gap{font:700 16px Manrope,sans-serif;min-width:110px;padding:2px 10px;margin:0 3px;border:none;border-bottom:2px dashed var(--ink);border-radius:0;background:#F1F3FA;color:var(--ink)}
  .gap:hover{background:#E3E8F5;color:var(--ink)}
  .gap.active{background:var(--hl);border-bottom-color:var(--margin)}
  .gap.ok{background:#E3F0DE;border-bottom:2px solid var(--good);color:var(--good)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{font-weight:800}
  .chip.used{opacity:.3;pointer-events:none}

  /* сопоставление */
  .match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .match button{width:100%;text-align:left;font-weight:800}
  .match button.sel{border-color:var(--margin);background:var(--hl);color:var(--text)}
  .match button.ok{border-color:var(--good);color:var(--good);background:#E3F0DE;pointer-events:none}
  .match button.hint{outline:3px dashed var(--margin);outline-offset:2px}

  /* анаграмма */
  .clue{font-size:19px;margin:0 0 4px;line-height:1.5}
  .clue small{font-size:14px;color:var(--muted);display:block}
  .built{display:flex;gap:6px;flex-wrap:wrap;min-height:52px;margin:14px 0 10px}
  .built span,.tiles button{width:44px;height:48px;display:inline-flex;align-items:center;justify-content:center;font:800 22px Manrope,sans-serif;text-transform:uppercase}
  .built span{border-bottom:3px solid var(--ink);color:var(--ink)}
  .built span.given{color:var(--good)}
  .tiles{display:flex;gap:6px;flex-wrap:wrap}
  .tiles button{padding:0}
  .tiles button.used{visibility:hidden}

  /* ввод */
  .typerow{margin-bottom:16px}
  .typerow input{font:600 18px Manrope,sans-serif;padding:8px 10px;border:none;border-bottom:2px solid var(--ink);background:#F1F3FA;width:100%;max-width:340px;margin-top:6px}
  .typerow input.ok{border-bottom-color:var(--good);color:var(--good);background:#E3F0DE}

  /* выбор */
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .opts button{font-weight:800}
  .opts button.no{opacity:.3;text-decoration:line-through;pointer-events:none}

  /* кодовый замок */
  .display{display:flex;gap:8px;margin:10px 0 14px}
  .display span{width:52px;height:62px;display:flex;align-items:center;justify-content:center;background:#1E1E28;color:#F9CAD5;font:700 40px Caveat,cursive}
  .keys{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
  .keys button{height:52px;padding:0;font-size:20px;font-weight:800}

  .found{margin-top:20px;padding:14px 16px;border:2px solid var(--margin);background:#FDF0F2}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{translate:-6px 0}40%,80%{translate:6px 0}}
  .msg{min-height:22px;font-weight:700;margin-top:10px}
  .msg.bad{color:var(--margin)}.msg.good{color:var(--good)}
  .counter{font-size:14px;color:var(--muted);margin-bottom:8px}

  .result,.teacher{margin-top:22px;padding:16px 18px;background:#fff;border:2px dashed var(--margin);display:none;position:relative;z-index:1}
  .teacher{border:2px solid var(--ink)}
  .result.show,.teacher.show{display:block}
  .result input,.teacher input{font:600 15px Manrope,sans-serif;padding:8px 10px;border:2px solid var(--ink);border-radius:3px;margin:6px 8px 6px 0}
  .result input{width:100%;max-width:320px}
  .report{white-space:pre-line;background:#F5F0E6;padding:10px 12px;margin:10px 0;font-weight:600;border-left:4px solid var(--ink)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ok-t{color:var(--good);font-weight:800}.bad-t{color:var(--margin);font-weight:800}
  .foot{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:relative;z-index:1}
  label.tog{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}

  @media (max-width:600px){
    .page{padding-left:44px}h1{font-size:42px}.sheet{padding:26px 18px 22px}.story{font-size:17px}
    .match,.opts{grid-template-columns:1fr}.door{font-size:10px}.note{font-size:16px;padding:12px}
  }
  @media (prefers-reduced-motion:reduce){.slot.got,.shake{animation:none}}
  /* ===== Японская тема: васи, сакура, клён ===== */
  :root{
    --paper:#FAF7F0; --grid:#ECE3D3; --ink:#22397A; --margin:#C8402F;
    --text:#2A2B33; --muted:#7A726A; --good:#3E7B3A; --hl:#F9CAD5;
    --sakura:#F4B3C2; --bark:#5B3A29;
  }
  .page{z-index:1}
  .top{display:flex;align-items:flex-start;gap:16px;position:relative;z-index:1}
  .hanko{flex:none;writing-mode:vertical-rl;font:700 15px/1 "Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:3px;
    color:#fff;background:var(--margin);padding:8px 5px;border-radius:3px;transform:rotate(5deg);margin-top:6px;
    box-shadow:inset 0 0 0 2px var(--margin),inset 0 0 0 3.5px #fff}
  .branch{position:absolute;top:-26px;right:-6px;width:170px;pointer-events:none;z-index:0}
  .sub{position:relative;z-index:1}
  .petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .petals i{position:absolute;top:-30px;width:12px;height:9px;background:var(--sakura);border-radius:12px 0 12px 0;opacity:.7;animation:fall linear infinite}
  .petals i.leaf{background:none;width:auto;height:auto;font-size:15px;font-style:normal;opacity:.8}
  @keyframes fall{to{transform:translate(var(--dx),112vh) rotate(560deg)}}
  @media (max-width:560px){.branch{width:84px;top:-22px;right:-10px;opacity:.7}}
  @media (prefers-reduced-motion:reduce){.petals{display:none}}
</style>
</head>
<body>
<div class="page">
  <svg class="branch" viewBox="0 0 200 120" aria-hidden="true">
    <defs><g id="fl"><g fill="#F4B3C2"><ellipse cy="-7" rx="5" ry="7"/><ellipse cy="-7" rx="5" ry="7" transform="rotate(72)"/><ellipse cy="-7" rx="5" ry="7" transform="rotate(144)"/><ellipse cy="-7" rx="5" ry="7" transform="rotate(216)"/><ellipse cy="-7" rx="5" ry="7" transform="rotate(288)"/></g><circle r="2.6" fill="#C8402F"/></g></defs>
    <path d="M202 6C160 18 128 30 98 54S46 88 8 98" stroke="#5B3A29" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M126 36C122 22 130 10 146 4M70 72C64 84 66 98 76 110" stroke="#5B3A29" stroke-width="3" fill="none" stroke-linecap="round"/>
    <use href="#fl" transform="translate(146 6)"/><use href="#fl" transform="translate(168 22) scale(.8)"/>
    <use href="#fl" transform="translate(104 52)"/><use href="#fl" transform="translate(76 108) scale(.9)"/>
    <use href="#fl" transform="translate(40 84) scale(.7)"/><use href="#fl" transform="translate(12 98) scale(.85)"/>
  </svg>
  <header>
    <div class="top"><h1 id="qTitle"></h1><span class="hanko" aria-hidden="true">京都</span></div>
    <p id="lead"></p>
  </header>

  <div class="track" id="track"></div>
  <div class="inv"><span class="l">Code numbers:</span><div id="slots" style="display:flex;gap:8px"></div></div>

  <main class="sheet" id="sheet"></main>

  <div class="result" id="result">
    <h2 id="resTitle">Mystery solved!</h2>
    <div>Write your name, copy your result and send it to your teacher as your answer.</div>
    <input id="studentName" placeholder="First and last name" autocomplete="name">
    <div class="report" id="report"></div>
    <div class="row"><button id="copyBtn">Copy my result</button><span id="copied"></span></div>
  </div>

  <div class="teacher" id="teacher">
    <h2>Проверка кода</h2>
    <div>Введите данные из результата ученика.</div>
    <div class="row">
      <input id="tName" placeholder="Имя">
      <input id="tMist" placeholder="Ошибки" size="7">
      <input id="tHints" placeholder="Подсказки" size="8">
      <input id="tCode" placeholder="Код" size="8">
      <button id="tCheck">Проверить</button>
    </div>
    <div id="tResult" aria-live="polite"></div>
  </div>

  <div class="foot">
    <button id="endBtn">Finish and get my code</button>
    <button id="restartBtn">Start again</button>
    <label class="tog"><input type="checkbox" id="autoSpeak" checked> Sound</label>
  </div>
</div>

<script>
// ================== СОДЕРЖАНИЕ КВЕСТА ==================
const TITLE = "The Red Leaves of Kyoto";
const INTRO = {
  en:"It is autumn in Kyoto, but something is wrong: overnight every maple tree in the city has lost its red leaves. An old woman at the station whispers to you: “A young fox spirit did it. She wanted to make a spell for the festival, but the magic went wrong. Only the little box at the Fox Shrine can fix it. The box has a lock with a secret code, and its numbers are hidden around the city.”",
  ru:"В Киото осень, но что-то не так: за одну ночь все клёны в городе потеряли красные листья. Пожилая женщина на вокзале шепчет вам: «Это сделала молодая лиса-оборотень. Она хотела сотворить заклинание к празднику, но магия пошла не так. Исправить всё может только маленькая шкатулка в Лисьем храме. На ней кодовый замок, а цифры кода спрятаны по всему городу»."
};
const ROOMS = [
  { name:"Station", type:"gap", digit:4,
    en:"Kyoto Station is very busy. A tired station worker is writing an announcement for the passengers, but the typhoon has made everybody nervous, and he can't finish it.",
    ru:"На вокзале Киото очень оживлённо. Уставший работник станции пишет объявление для пассажиров, но тайфун всех взволновал, и он не может его закончить.",
    task:"Click a gap, then click the right word. When you are ready, click Check.",
    note:"Dear passengers,\nBecause of the typhoon there is [0] of forty minutes. Please accept our [1]. There are big [2] on platform 2, so please be careful. You can find a new [3] to the Fox Shrine on the map.\n— Kyoto Station",
    answers:["a delay","apology","crowds","route"], extra:["tights","slurp"],
    found:{en:"The worker bows and gives you the map. On the back someone has drawn a red fox and the number 4.", ru:"Работник кланяется и даёт вам карту. На обороте кто-то нарисовал рыжую лису и цифру 4."} },
  { name:"Market", type:"match", digit:8,
    en:"Nishiki Market smells of fish, tea and sweets. An old shopkeeper has dropped the labels from his dictionary box. “Help me,” he says, “and I'll show you something.”",
    ru:"Рынок Нисики пахнет рыбой, чаем и сладостями. Пожилой продавец уронил таблички из своей коробки-словаря. «Помогите мне, — говорит он, — и я вам кое-что покажу»."
    , task:"Match the English words with their translations.",
    pairs:[["purchases","покупки"],["tights","чулки"],["even though","несмотря на"],["touch wood","тьфу-тьфу"]],
    found:{en:"The shopkeeper lights a paper lantern. On the lantern you see the number 8.", ru:"Продавец зажигает бумажный фонарик. На фонарике вы видите цифру 8."} },
  { name:"Noodle bar", type:"scramble", digit:1,
    en:"You are hungry, so you go into a tiny noodle bar. The cook has a recipe book with strange words. “Read it,” he laughs, “and the soup is free.”",
    ru:"Вы проголодались и заходите в крошечную лапшичную. У повара есть книга рецептов со странными словами. «Прочитаете — суп бесплатно», — смеётся он."
    , task:"Build the word from the letters. Click the letters in the right order.",
    items:[
      {word:"slurp", ru:"прихлёбывать", clue:"In Japan it's OK to ___ your noodles."},
      {word:"muffle", ru:"приглушать", clue:"The cook closes the door to ___ the noise of the street."},
      {word:"pleased", ru:"довольный", clue:"The cook is very ___ because you ate everything."},
      {word:"appear", ru:"появляться", clue:"“Foxes ___ when the moon is full,” he whispers."}
    ],
    found:{en:"You finish the soup. At the bottom of the bowl there is a painted number 1.", ru:"Вы доедаете суп. На дне миски нарисована цифра 1."} },
  { name:"Temple", type:"type", digit:6,
    en:"The temple garden is quiet and grey. An old monk is sweeping the path. “Finish my sentences,” he says, “and I'll give you what the fox left here.”",
    ru:"Сад при храме тихий и серый. Старый монах подметает дорожку. «Закончи мои предложения, — говорит он, — и я отдам тебе то, что здесь оставила лиса»."
    , task:"Type the English word. There is a hint in Russian under each sentence.",
    items:[
      {answer:["maple tree"], ru:"клён", clue:"The old ___ by the pond has no red leaves this year."},
      {answer:["disappointed"], ru:"разочарован", clue:"A little boy is ___ because the garden looks so grey."},
      {answer:["embarrassed"], ru:"смущённый", clue:"You step on the moss by mistake and feel ___."},
      {answer:["forgive"], ru:"прощаю", clue:"The monk smiles: “Don't worry. I ___ you.”"}
    ],
    found:{en:"The monk gives you a small wooden plaque with a fox on it. Under the fox it says: 6.", ru:"Монах даёт вам маленькую деревянную табличку с лисой. Под лисой написано: 6."} },
  { name:"Fox Shrine", type:"choose", digit:null,
    en:"You walk up through hundreds of red gates to the Fox Shrine. In a small tea house a fox girl is crying. Smoke is everywhere. She tells you what happened, but her words are all mixed up. Help her explain.",
    ru:"Вы поднимаетесь через сотни красных ворот к Лисьему храму. В маленьком чайном домике плачет девочка-лиса. Повсюду дым. Она рассказывает, что случилось, но её слова перепутались. Помогите ей объяснить."
    , task:"Choose the words that match the explanation.",
    items:[
      {def:"to use magic words to change something", answer:"make a spell"},
      {def:"she tries again and again, but it doesn't work", answer:"she isn't succeeding"},
      {def:"flames went up out of the pipe on the roof", answer:"the fire came out from the chimney"},
      {def:"how likely it is that something will happen", answer:"probability"}
    ] }
];
const FINALE = {
  en:"The box opens with a soft click. Inside there is a little silver bell. The fox girl rings it, and red leaves appear on every maple tree in Kyoto again. “Please forgive me,” she says. “I wanted to make a spell for the festival, but I wasn't succeeding.” You are not disappointed at all: the city is red and gold, the crowds are back in the streets, and everybody is pleased. The mystery is solved!",
  ru:"Шкатулка открывается с тихим щелчком. Внутри маленький серебряный колокольчик. Девочка-лиса звонит в него, и на каждом клёне в Киото снова появляются красные листья. «Пожалуйста, простите меня, — говорит она. — Я хотела сотворить заклинание к празднику, но у меня не получалось». Вы совсем не разочарованы: город красно-золотой, на улицы вернулись толпы, и все довольны. Тайна раскрыта!"
};
// =======================================================

const $=id=>document.getElementById(id);
const sheet=$("sheet");
const CODE=ROOMS.filter(r=>r.digit!==null).map(r=>r.digit);
const WORD_COUNT=ROOMS.reduce((n,r)=>n+(r.answers||r.pairs||r.items).length,0);
document.title="Quest: "+TITLE;$("qTitle").textContent=TITLE;
$("lead").textContent=`A quest with ${WORD_COUNT} words. Visit ${ROOMS.length} places in Kyoto, find ${CODE.length} code numbers and open the fox's box.`;
let room, digits, mistakes, hints, errWords, startTime, result, finished, state;

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/\s+/g," ").trim();

function speak(t){if(!$("autoSpeak").checked||!("speechSynthesis" in window))return;const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}
function miss(word){mistakes++;errWords[word]=(errWords[word]||0)+1}
function shake(el){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}
function msg(text,kind){const m=$("msg");if(m){m.textContent=text;m.className="msg "+(kind||"")}}

function drawTrack(){
  $("track").innerHTML=ROOMS.map((r,i)=>`<div class="door ${i<room?"done":i===room?"now":""}">${esc(r.name)}</div>`).join("");
  $("slots").innerHTML=CODE.map((d,i)=>`<div class="slot ${digits[i]!=null?"got":""}">${digits[i]!=null?digits[i]:"?"}</div>`).join("");
}
function storyBlock(en,ru){
  return `<p class="story">${esc(en)}</p>
    <button class="linkbtn" onclick="this.nextElementSibling.classList.toggle('show')">Show translation</button>
    <p class="ru">${esc(ru)}</p>`;
}

// ---------- экраны ----------
function showIntro(){
  sheet.innerHTML=`<div class="seal">京</div><h2>Autumn in Kyoto</h2>${storyBlock(INTRO.en,INTRO.ru)}
    <div class="actions"><button class="main" id="go">Start the journey</button>
    <button id="listen">🔊 Listen</button></div>`;
  $("go").onclick=()=>{room=0;showRoom()};
  $("listen").onclick=()=>speak(INTRO.en);
}
function showRoom(){
  drawTrack();
  const r=ROOMS[room];
  sheet.innerHTML=`<div class="seal">${room+1}</div><h2>${esc(r.name)}</h2>${storyBlock(r.en,r.ru)}
    <div class="task">${esc(r.task)}</div><div id="puzzle"></div><div class="msg" id="msg" aria-live="polite"></div>
    <div class="actions" id="acts"><button id="hintBtn">Hint</button></div>`;
  $("hintBtn").onclick=()=>{hints++;state.hint()};
  ({gap:gapRoom,match:matchRoom,scramble:scrambleRoom,type:typeRoom,choose:chooseRoom})[r.type](r);
  sheet.scrollIntoView({behavior:"smooth",block:"start"});
}
function roomSolved(){
  const r=ROOMS[room];
  $("hintBtn").remove();
  if(r.digit===null){keypad();return}
  digits[CODE.indexOf(r.digit)]=r.digit;drawTrack();
  const f=document.createElement("div");f.className="found";
  f.innerHTML=storyBlock(r.found.en,r.found.ru)+`<div class="actions"><button class="main" id="next">Next: ${esc(ROOMS[room+1].name)}</button></div>`;
  $("puzzle").after(f);msg("","");
  $("next").onclick=()=>{room++;showRoom()};
  $("next").focus();
}

// ---------- 1. записка с пропусками ----------
function gapRoom(r){
  const p=$("puzzle");
  const html=esc(r.note).replace(/\[(\d)\]/g,(m,i)=>`<button class="gap" data-i="${i}">&nbsp;</button>`);
  const words=shuffle([...r.answers,...r.extra]);
  p.innerHTML=`<div class="note">${html}</div><div class="chips">${words.map(w=>`<button class="chip" data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div>`;
  $("acts").insertAdjacentHTML("afterbegin",`<button class="main" id="check">Check</button>`);
  const fill={};let active=0;
  const gaps=[...p.querySelectorAll(".gap")];
  const mark=()=>gaps.forEach((g,i)=>{g.classList.toggle("active",i===active&&!g.classList.contains("ok"));g.innerHTML=fill[i]?esc(fill[i]):"&nbsp;"});
  const syncChips=()=>p.querySelectorAll(".chip").forEach(c=>c.classList.toggle("used",Object.values(fill).includes(c.dataset.w)));
  gaps.forEach((g,i)=>g.onclick=()=>{if(g.classList.contains("ok"))return;if(fill[i]&&active===i){delete fill[i];syncChips()}active=i;mark()});
  p.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    if(active==null||gaps[active].classList.contains("ok"))return;
    fill[active]=c.dataset.w;syncChips();
    const nxt=gaps.findIndex((g,i)=>!fill[i]&&!g.classList.contains("ok"));active=nxt<0?active:nxt;mark();
  });
  $("check").onclick=()=>{
    let wrong=0;
    gaps.forEach((g,i)=>{
      if(g.classList.contains("ok"))return;
      if(fill[i]===r.answers[i]){g.classList.add("ok")}
      else{if(fill[i]){wrong++;miss(r.answers[i])}delete fill[i];shake(g)}
    });
    syncChips();
    const left=gaps.findIndex(g=>!g.classList.contains("ok"));
    if(left<0){$("check").remove();speak(r.note.replace(/\[(\d)\]/g,(m,i)=>r.answers[i]).split("\n— ")[0]);roomSolved();return}
    active=left;mark();
    msg(wrong?`Wrong words: ${wrong}. They have been removed, try again.`:"Fill in all the gaps.","bad");
  };
  state={hint:()=>{
    const i=gaps.findIndex(g=>!g.classList.contains("ok"));if(i<0)return;
    Object.keys(fill).forEach(k=>{if(fill[k]===r.answers[i])delete fill[k]});
    fill[i]=r.answers[i];gaps[i].classList.add("ok");syncChips();
    const nxt=gaps.findIndex(g=>!g.classList.contains("ok"));active=nxt<0?0:nxt;mark();
    if(nxt<0){$("check").click()}
  }};
  mark();
}

// ---------- 2. сопоставление ----------
function matchRoom(r){
  const p=$("puzzle");
  const left=shuffle(r.pairs.map((x,i)=>i)),right=shuffle(r.pairs.map((x,i)=>i));
  p.innerHTML=`<div class="match"><div style="display:grid;gap:10px">${left.map(i=>`<button data-side="en" data-i="${i}">${esc(r.pairs[i][0])}</button>`).join("")}</div>
    <div style="display:grid;gap:10px">${right.map(i=>`<button data-side="ru" data-i="${i}">${esc(r.pairs[i][1])}</button>`).join("")}</div></div>`;
  let sel={en:null,ru:null},done=0;
  const btn=(side,i)=>p.querySelector(`[data-side="${side}"][data-i="${i}"]`);
  const tryPair=()=>{
    if(sel.en==null||sel.ru==null)return;
    const a=btn("en",sel.en),b=btn("ru",sel.ru);
    if(sel.en===sel.ru){[a,b].forEach(x=>{x.classList.remove("sel","hint");x.classList.add("ok")});speak(r.pairs[sel.en][0]);done++;msg("","")}
    else{miss(r.pairs[sel.en][0]);shake(a);shake(b);a.classList.remove("sel");b.classList.remove("sel");msg("Not a pair. Try another one.","bad")}
    sel={en:null,ru:null};
    if(done===r.pairs.length)roomSolved();
  };
  p.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const s=b.dataset.side;p.querySelectorAll(`[data-side="${s}"]`).forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel");sel[s]=+b.dataset.i;tryPair();
  });
  state={hint:()=>{
    const i=r.pairs.findIndex((x,k)=>!btn("en",k).classList.contains("ok"));if(i<0)return;
    btn("en",i).classList.add("hint");btn("ru",i).classList.add("hint");
  }};
}

// ---------- 3. анаграммы ----------
function scrambleRoom(r){
  let k=0,built=[],given=0;
  const draw=()=>{
    const it=r.items[k],letters=it.word.split("");
    let order=shuffle(letters.map((c,i)=>i));
    if(order.every((v,i)=>v===i))order.reverse();
    $("puzzle").innerHTML=`<div class="counter">Word ${k+1} of ${r.items.length}</div>
      <p class="clue">${esc(it.clue)}<small>${esc(it.ru)}</small></p>
      <div class="built" id="built"></div><div class="tiles" id="tiles">${order.map(i=>`<button data-i="${i}">${esc(letters[i])}</button>`).join("")}</div>
      <div class="actions"><button id="back">← Delete a letter</button></div>`;
    built=[];given=0;render();
    $("tiles").querySelectorAll("button").forEach(b=>b.onclick=()=>{built.push(b);b.classList.add("used");render();check()});
    $("back").onclick=()=>{if(built.length>given){built.pop().classList.remove("used");render()}};
  };
  const render=()=>{
    const it=r.items[k];
    $("built").innerHTML=it.word.split("").map((c,i)=>`<span class="${i<given?"given":""}">${built[i]?esc(built[i].textContent):""}</span>`).join("");
  };
  const check=()=>{
    const it=r.items[k];
    if(built.length<it.word.length)return;
    if(built.map(b=>b.textContent).join("")===it.word){
      speak(it.clue.replace("___",it.word));msg("Correct!","good");k++;
      if(k<r.items.length)setTimeout(()=>{msg("","");draw()},700);
      else{$("puzzle").innerHTML=`<p class="clue">${r.items.map(i=>esc(i.clue.replace("___",i.word))).join("<br>")}</p>`;roomSolved()}
    }else{
      miss(it.word);shake($("built"));msg("That's not the word. Try again.","bad");
      setTimeout(()=>{built.slice(given).forEach(b=>b.classList.remove("used"));built=built.slice(0,given);render()},450);
    }
  };
  state={hint:()=>{
    const it=r.items[k];if(!it||given>=it.word.length-1)return;
    built.slice(given).forEach(b=>b.classList.remove("used"));built=built.slice(0,given);
    const need=it.word[given];
    const tile=[...$("tiles").querySelectorAll("button:not(.used)")].find(b=>b.textContent===need);
    tile.classList.add("used");built.push(tile);given++;render();
  }};
  draw();
}

// ---------- 4. вписать слово ----------
function typeRoom(r){
  const p=$("puzzle");
  p.innerHTML=r.items.map((it,i)=>`<div class="typerow"><p class="clue">${esc(it.clue)}<small>${esc(it.ru)}</small></p>
    <input id="in${i}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Answer ${i+1}"></div>`).join("");
  $("acts").insertAdjacentHTML("afterbegin",`<button class="main" id="check">Check</button>`);
  const inputs=r.items.map((it,i)=>$("in"+i));
  const okAt=i=>inputs[i].classList.contains("ok");
  inputs.forEach(el=>el.addEventListener("keydown",e=>{if(e.key==="Enter")$("check").click()}));
  $("check").onclick=()=>{
    let wrong=0,empty=0;
    r.items.forEach((it,i)=>{
      if(okAt(i))return;const v=norm(inputs[i].value);
      if(!v){empty++;return}
      if(it.answer.map(norm).includes(v)){inputs[i].classList.add("ok");inputs[i].readOnly=true;inputs[i].value=it.answer[0]}
      else{wrong++;miss(it.answer[0]);shake(inputs[i])}
    });
    if(inputs.every((x,i)=>okAt(i))){$("check").remove();speak(r.items.map(it=>it.clue.replace("___",it.answer[0])).join(" "));roomSolved();return}
    msg(wrong?`Mistakes: ${wrong}. Check your spelling.`:empty?"Fill in all the lines.":"","bad");
  };
  state={hint:()=>{
    const i=inputs.findIndex((x,k)=>!okAt(k));if(i<0)return;
    const a=r.items[i].answer[0],cur=norm(inputs[i].value);
    let n=0;while(n<cur.length&&cur[n]===a[n])n++;
    inputs[i].value=a.slice(0,Math.min(a.length,Math.max(n+2,3)));inputs[i].focus();
  }};
}

// ---------- 5. выбор по объяснению ----------
function chooseRoom(r){
  let k=0;
  const opts=r.items.map(x=>x.answer);
  const draw=()=>{
    const it=r.items[k];
    $("puzzle").innerHTML=`<div class="counter">Explanation ${k+1} of ${r.items.length}</div>
      <p class="clue">“${esc(it.def)}”</p><div class="opts">${shuffle(opts).map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
    $("puzzle").querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{
      if(b.dataset.o===it.answer){speak(it.answer);k++;msg("Correct!","good");
        if(k<r.items.length)setTimeout(()=>{msg("","");draw()},600);else setTimeout(roomSolved,600)}
      else{miss(it.answer);b.classList.add("no");msg("No, that means something else.","bad")}
    });
  };
  state={hint:()=>{
    const it=r.items[k];if(!it)return;
    const w=[...$("puzzle").querySelectorAll(".opts button:not(.no)")].filter(b=>b.dataset.o!==it.answer);
    if(w.length>1)w[Math.floor(Math.random()*w.length)].classList.add("no");
  }};
  draw();
}

// ---------- кодовый замок ----------
function keypad(){
  let entry="";
  $("puzzle").innerHTML=`<div class="found"><p class="story">The fox girl stops crying and gives you the little box. Now it's time to open it.</p></div>
    <p class="clue" style="margin-top:18px">Enter the code: the numbers you found.</p>
    <div class="display" id="disp"></div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}<button id="clr">⌫</button><button data-n="0">0</button><button class="main" id="ent">OK</button></div>`;
  $("acts").remove();
  const show=()=>$("disp").innerHTML=CODE.map((d,i)=>`<span>${entry[i]||""}</span>`).join("");
  $("puzzle").querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{if(entry.length<CODE.length){entry+=b.dataset.n;show()}});
  $("clr").onclick=()=>{entry=entry.slice(0,-1);show()};
  $("ent").onclick=()=>{
    if(entry===CODE.join("")){ending()}
    else{mistakes++;shake($("disp"));msg("The box is still locked. Look at your code numbers at the top: they go in the order of the places.","bad");entry="";show()}
  };
  show();
}
function ending(){
  room=ROOMS.length;drawTrack();
  sheet.innerHTML=`<div class="seal">✓</div><h2>Red leaves again</h2>${storyBlock(FINALE.en,FINALE.ru)}
    <div class="actions"><button id="listen">🔊 Listen</button></div>`;
  $("listen").onclick=()=>speak(FINALE.en);
  finish(false);
}

// ---------- результат и код ----------
const SALT="quest-kyoto-2026";
function makeCode(name,m,h){
  const str=[SALT,name.trim().toLowerCase(),m,h].join("|");
  let x=2166136261;
  for(let i=0;i<str.length;i++){x^=str.charCodeAt(i);x=Math.imul(x,16777619)>>>0}
  return x.toString(36).toUpperCase().padStart(7,"0").slice(-6);
}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function buildReport(){
  const name=$("studentName").value.trim()||"(no name)",r=result;
  $("report").textContent=`Quest: ${TITLE}\nName: ${name}\nCompleted: ${r.status}\nMistakes: ${r.m}\nHints: ${r.h}\nTime: ${r.time}`+
    (r.hard.length?`\nWords to review: ${r.hard.join(", ")}`:"")+`\nCode: ${makeCode(name,r.m,r.h)}`;
}
function finish(early){
  if(finished)return;finished=true;
  const hard=Object.entries(errWords).sort((a,b)=>b[1]-a[1]).map(([w])=>w);
  result={m:mistakes,h:hints,hard,time:fmt(Math.floor((Date.now()-startTime)/1000)),
    status:early?`${Math.min(room,ROOMS.length)} of ${ROOMS.length} places`:"the whole quest"};
  $("resTitle").textContent=early?"Quest not finished":"Mystery solved!";
  buildReport();$("result").classList.add("show");
  if(!early)setTimeout(()=>$("result").scrollIntoView({behavior:"smooth",block:"nearest"}),400);
}
$("studentName").oninput=()=>{if(result)buildReport()};
$("copyBtn").onclick=async()=>{
  const t=$("report").textContent,m=$("copied");
  try{await navigator.clipboard.writeText(t);m.textContent="Copied"}
  catch(e){const r=document.createRange();r.selectNodeContents($("report"));const s=getSelection();s.removeAllRanges();s.addRange(r);m.textContent="Text selected, press Ctrl+C"}
};
$("endBtn").onclick=()=>{if(finished)return;if(confirm("Finish the quest and get your result?")){finish(true);$("result").scrollIntoView({behavior:"smooth"})}};
$("restartBtn").onclick=()=>{if(confirm("Start the quest again?"))start()};

const teacherMode=()=>$("teacher").classList.toggle("show",location.hash==="#teacher");
teacherMode();window.addEventListener("hashchange",teacherMode);
$("tCheck").onclick=()=>{
  const v=id=>$(id).value.trim();
  const ok=makeCode(v("tName"),v("tMist"),v("tHints"))===v("tCode").toUpperCase();
  $("tResult").innerHTML=ok?'<span class="ok-t">Код верный, результат не изменён.</span>':'<span class="bad-t">Код не совпадает. Проверьте, что данные введены точно как в результате.</span>';
};

function start(){
  room=0;digits=[];mistakes=0;hints=0;errWords={};startTime=Date.now();result=null;finished=false;
  $("result").classList.remove("show");$("copied").textContent="";
  drawTrack();showIntro();
}
// Падающие лепестки сакуры и листья клёна (отключаются при «уменьшить движение»)
(function(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const box=document.createElement("div");box.className="petals";box.setAttribute("aria-hidden","true");
  for(let i=0;i<14;i++){
    const p=document.createElement("i");
    if(i%5===4){p.className="leaf";p.textContent="🍁"}
    p.style.left=Math.random()*100+"vw";
    p.style.animationDuration=(10+Math.random()*10)+"s";
    p.style.animationDelay=(-Math.random()*20)+"s";
    p.style.setProperty("--dx",(Math.random()*180-90)+"px");
    box.appendChild(p);
  }
  document.body.prepend(box);
})();
start();
