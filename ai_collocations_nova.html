<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk to Nova: AI collocations</title>
<style>
:root{
  --bg:#f3efff; --panel:#ffffff; --soft:#ece6ff; --line:#ddd3fb;
  --ink:#241b4b; --muted:#6c6394;
  --mint:#20c997; --sun:#ffc531; --coral:#ff6f9f; --sky:#4d9dff; --grape:#7b5cff;
  --mint-s:#d8f7ec; --sun-s:#fff1c7; --coral-s:#ffe0eb; --sky-s:#dcebff; --grape-s:#e6dfff;
  --bubble-ai:#ffffff; --bubble-me:#7b5cff; --bubble-me-text:#ffffff;
  --bot:#7b5cff; --bot-face:#ffffff; --shadow:0 6px 0 rgba(36,27,75,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#17122f; --panel:#221a44; --soft:#2b2257; --line:#3b3070;
    --ink:#f2eeff; --muted:#aca3d6;
    --mint-s:#123d36; --sun-s:#3d3214; --coral-s:#47203a; --sky-s:#1b2f52; --grape-s:#352a6b;
    --bubble-ai:#2b2257; --bubble-me:#7b5cff; --bubble-me-text:#ffffff;
    --bot:#9b84ff; --bot-face:#1d163d; --shadow:0 6px 0 rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* header */
header{display:flex;align-items:center;gap:16px;padding:16px 24px;flex-wrap:wrap}
.hero{display:flex;align-items:center;gap:14px}
.hero h1{margin:0;font-size:26px;line-height:1.1}
.hero p{margin:2px 0 0;color:var(--muted);font-size:14px}
header .spacer{flex:1}
.controls{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;box-shadow:var(--shadow)}
.switch{display:flex;align-items:center;gap:10px;border:0;background:none;padding:2px 4px;font-weight:700}
.track{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"] .track{background:var(--mint)}
.switch[aria-checked="true"] .track::after{transform:translateX(20px)}
.controls select{border:0;background:var(--soft);color:var(--ink);border-radius:999px;padding:6px 10px;font:inherit;font-size:14px}

/* robot avatar */
.bot{--s:56px;width:var(--s);height:var(--s);border-radius:30%;background:var(--bot);position:relative;flex:none;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15)}
.bot::before{content:"";position:absolute;left:50%;top:-14%;width:6%;height:16%;background:var(--bot);transform:translateX(-50%);border-radius:2px}
.bot::after{content:"";position:absolute;left:50%;top:-24%;width:18%;height:18%;background:var(--sun);border-radius:50%;transform:translateX(-50%)}
.bot .face{position:absolute;inset:18% 14% 16%;background:var(--bot-face);border-radius:28%}
.bot .eye{position:absolute;top:30%;width:16%;height:22%;background:var(--ink);border-radius:50%}
@media (prefers-color-scheme:dark){.bot .eye{background:#7ff0d0}}
.bot .eye.l{left:24%} .bot .eye.r{right:24%}
.bot .mouth{position:absolute;left:50%;bottom:20%;width:34%;height:10%;background:var(--coral);border-radius:0 0 999px 999px;transform:translateX(-50%)}
.bot.big{--s:64px}
.bot.small{--s:38px}
@media (prefers-reduced-motion:no-preference){
  .bot .eye{animation:blink 4s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  .bot.talking .mouth{animation:talk .22s infinite alternate}
  @keyframes talk{from{height:8%}to{height:24%;border-radius:999px}}
}

/* layout */
.wrap{display:grid;grid-template-columns:280px 1fr;gap:20px;padding:0 24px 24px;max-width:1200px;margin:0 auto}
.missions{display:flex;flex-direction:column;gap:12px}
.mission{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:var(--panel);border-radius:20px;padding:12px 14px;text-align:left;box-shadow:var(--shadow);transition:transform .15s}
.mission:hover{transform:translateY(-2px)}
.mission.active{border-color:var(--grape)}
.sticker{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:none;transform:rotate(-6deg)}
.mission:nth-child(2) .sticker{transform:rotate(5deg)}
.mission .t{font-weight:800;display:block}
.mission .d{font-size:13px;color:var(--muted)}
.stars{margin-left:auto;font-size:14px;letter-spacing:1px;white-space:nowrap}
.progress{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.progress .lbl{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.pbar{height:14px;border-radius:999px;background:var(--soft);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--sky),var(--grape));border-radius:999px;transition:width .5s}

.chat{background:var(--panel);border:2px solid var(--line);border-radius:28px;display:flex;flex-direction:column;min-height:620px;max-height:calc(100vh - 130px);box-shadow:var(--shadow);overflow:hidden}
.chathead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:2px solid var(--line)}
.chathead b{display:block}
.chathead .online{font-size:13px;color:var(--mint)}
.thread{flex:1;min-height:260px;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;background:radial-gradient(circle at 20px 20px,var(--soft) 2px,transparent 2.5px) 0 0/28px 28px}
.msg{display:flex;align-items:flex-end;gap:10px;max-width:86%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{background:var(--bubble-ai);border:2px solid var(--line);border-radius:22px 22px 22px 6px;padding:12px 16px}
.msg.me .bubble{background:var(--bubble-me);color:var(--bubble-me-text);border-color:var(--bubble-me);border-radius:22px 22px 6px 22px}
.me-av{width:38px;height:38px;border-radius:50%;background:var(--sun-s);display:grid;place-items:center;font-size:22px;flex:none}
.bubble .big{font-size:20px;font-weight:700;line-height:1.45}
.bubble .gap{display:inline-block;min-width:110px;border-bottom:3px dashed var(--grape);text-align:center;color:var(--grape)}
.bubble .bug{background:var(--coral-s);color:var(--coral);border-radius:8px;padding:0 6px;text-decoration:line-through wavy}
.bubble .fixed{background:var(--mint-s);color:var(--mint);border-radius:8px;padding:0 6px}
.say{border:0;background:var(--soft);border-radius:999px;padding:2px 10px;margin-left:8px;font-size:14px;vertical-align:middle}
.voice-off .say{display:none}
.tag{display:inline-block;font-size:12px;font-weight:800;color:var(--grape);background:var(--grape-s);border-radius:999px;padding:2px 10px;margin-bottom:6px}

/* dock */
.dock{border-top:2px solid var(--line);padding:16px 18px;background:var(--panel);max-height:48%;overflow:auto}
.dock .hint{font-size:13px;color:var(--muted);margin-bottom:10px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:10px 16px;font-weight:700;box-shadow:0 4px 0 var(--line);transition:transform .1s}
.opt:hover{transform:translateY(-2px)}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt[disabled]{opacity:.35;cursor:not-allowed;transform:none}
.opt.v{background:var(--sky-s);border-color:var(--sky);box-shadow:0 4px 0 var(--sky)}
.opt.n{background:var(--sun-s);border-color:var(--sun);box-shadow:0 4px 0 var(--sun)}
.opt.sel{outline:3px solid var(--grape);outline-offset:2px}
.opt.done{background:var(--mint-s);border-color:var(--mint);box-shadow:none;opacity:.5}
.cols{display:flex;flex-direction:column;gap:12px}
.cols .glabel{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}
.cols .opt{padding:8px 14px}
.next{background:var(--grape);color:#fff;border:0;border-radius:16px;padding:12px 22px;font-weight:800;box-shadow:0 4px 0 #5136d1}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* confetti */
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.fx span{position:absolute;top:-40px;font-size:30px}
@media (prefers-reduced-motion:no-preference){ .fx span{animation:fall linear forwards} @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}} }

@media (max-width:820px){
  .wrap{grid-template-columns:1fr;padding:0 12px 12px}
  .missions{flex-direction:row;overflow:auto}
  .mission{min-width:210px}
  .progress{min-width:200px}
  .chat{max-height:none;min-height:70vh}
  
  .msg{max-width:96%}
  header{padding:14px 12px}
}
</style>
</head>
<body>
<header>
  <div class="hero">
    <div class="bot big live" aria-hidden="true"><div class="face"><span class="eye l"></span><span class="eye r"></span><span class="mouth"></span></div></div>
    <div><h1>Talk to Nova 🤖✨</h1><p>Your AI buddy for collocations about the future of AI</p></div>
  </div>
  <span class="spacer"></span>
  <div class="controls">
    <button class="switch" id="voice" role="switch" aria-checked="true"><span id="voiceIcon">🔊</span> Voice <span class="track"></span></button>
    <select id="accent" aria-label="Accent"><option value="en-GB">🇬🇧 UK</option><option value="en-US">🇺🇸 US</option></select>
    <select id="rate" aria-label="Speed"><option value="0.8">🐢 slow</option><option value="1" selected>🐇 normal</option></select>
  </div>
</header>

<div class="wrap">
  <aside class="missions" id="missions"></aside>
  <section class="chat">
    <div class="chathead">
      <div class="bot small live" aria-hidden="true"><div class="face"><span class="eye l"></span><span class="eye r"></span><span class="mouth"></span></div></div>
      <div><b>Nova</b><span class="online">● online, ready to practise</span></div>
    </div>
    <div class="thread" id="thread" aria-live="polite"></div>
    <div class="dock" id="dock"></div>
  </section>
</div>
<div class="fx" id="fx"></div>

<script>
const EMO = {"existential risks":"☄️","clean energy":"⚡","human civilization":"🏙️","AI":"🤖","digital minds":"🧠","moral status":"⚖️","a new level of intellect":"🐣","responsibility":"🙋","a scenario seriously":"🎬"};
const PAIRS = [
  ["face","existential risks"],["develop","clean energy"],["override","human civilization"],
  ["misuse","AI"],["construct","digital minds"],["gain","moral status"],
  ["give birth to","a new level of intellect"],["take","responsibility"],["take","a scenario seriously"]
];
const GAPS = [
  {pre:"Humanity may face ",post:" risks if AI isn't developed responsibly.",opts:["digital","existential","clean"],ans:"existential"},
  {pre:"There's a growing debate about how we should ",post:" digital minds.",opts:["construct","override","face"],ans:"construct"},
  {pre:"According to Bostrom, AI might eventually ",post:" human civilization.",opts:["develop","gain","override"],ans:"override"},
  {pre:"If treated ethically, digital beings might gain ",post:".",opts:["moral status","clean energy","responsibility"],ans:"moral status"},
  {pre:"AI might help us ",post:" energy and medical technologies.",opts:["misuse","develop clean","face existential"],ans:"develop clean"},
  {pre:"We need to ensure we don't ",post:" AI for harmful purposes.",opts:["take","gain","misuse"],ans:"misuse"}
];
const FIX = [
  {pre:"Companies must ",bug:"make",post:" AI responsibly.",opts:["override","develop","gain"],ans:"develop"},
  {pre:"Scientists should ",bug:"do",post:" this scenario seriously.",opts:["take","face","make"],ans:"take"},
  {pre:"Humanity could ",bug:"meet",post:" existential risks in the future.",opts:["gain","misuse","face"],ans:"face"},
  {pre:"Criminals might ",bug:"wrong-use",post:" AI to steal money.",opts:["misuse","override","develop"],ans:"misuse"},
  {pre:"A superintelligence could ",bug:"overcome",post:" human control.",opts:["construct","override","take"],ans:"override"},
  {pre:"Who will ",bug:"make",post:" responsibility if AI makes a mistake?",opts:["gain","face","take"],ans:"take"}
];
const DEF = [
  {def:"use AI in a wrong or harmful way",opts:["misuse AI","develop AI","face AI"],ans:"misuse AI"},
  {def:"deal with dangers that could end humanity",opts:["gain existential risks","face existential risks","take existential risks"],ans:"face existential risks"},
  {def:"believe a possible future is real and important",opts:["take a scenario seriously","make a scenario seriously","face a scenario"],ans:"take a scenario seriously"},
  {def:"create a much smarter kind of mind",opts:["override a new level of intellect","give birth to a new level of intellect","misuse a new level of intellect"],ans:"give birth to a new level of intellect"},
  {def:"become more powerful than people and their rules",opts:["construct human civilization","develop human civilization","override human civilization"],ans:"override human civilization"},
  {def:"be accepted as someone who has rights",opts:["gain moral status","take moral status","face moral status"],ans:"gain moral status"}
];
const MISSIONS = [
  {id:"match",emoji:"🧩",color:"var(--sky-s)",t:"Match the pairs",d:"Verb + partner",total:PAIRS.length},
  {id:"gaps",emoji:"✍️",color:"var(--sun-s)",t:"Fill the gaps",d:"Sentences from the talk",total:GAPS.length},
  {id:"fix",emoji:"🐞",color:"var(--coral-s)",t:"Fix the bug",d:"Find the wrong verb",total:FIX.length},
  {id:"define",emoji:"📖",color:"var(--mint-s)",t:"Guess by meaning",d:"Pick the collocation",total:DEF.length}
];
const PRAISE = ["Nice! 🎉","Exactly! ✨","Brilliant! 🚀","Spot on! 🎯","You got it! 💜","Perfect! 🌟"];
const OOPS = ["Hmm, not quite 🤔 Try again!","Close, but no 🙈 One more try!","Not this one 😅 Try another!"];
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

const score = {match:null,gaps:null,fix:null,define:null};
const best = {match:0,gaps:0,fix:0,define:0};
let mission = null, idx = 0, firstTry = 0, missed = false;
const thread = document.getElementById("thread"), dock = document.getElementById("dock");

/* ---------- voice ---------- */
const synth = window.speechSynthesis; let voices = [], voiceOn = true;
const loadVoices = () => voices = synth ? synth.getVoices() : [];
if(synth){ loadVoices(); synth.onvoiceschanged = loadVoices; }
function talking(on){ document.querySelectorAll(".bot.live").forEach(b=>b.classList.toggle("talking",on)); }
function speak(text, queue){
  if(!voiceOn || !synth || !text) return;
  if(!queue) synth.cancel();
  const clean = text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,"").trim();
  const u = new SpeechSynthesisUtterance(clean);
  const lang = document.getElementById("accent").value; u.lang = lang;
  const v = voices.find(v=>v.lang===lang) || voices.find(v=>(v.lang||"").startsWith("en")); if(v) u.voice=v;
  u.rate = parseFloat(document.getElementById("rate").value);
  u.onstart = ()=>talking(true);
  u.onend = u.onerror = ()=>{ if(!synth.speaking) talking(false); };
  synth.speak(u);
}
const vBtn = document.getElementById("voice");
function setVoice(on){
  voiceOn = on; vBtn.setAttribute("aria-checked", on);
  document.getElementById("voiceIcon").textContent = on ? "🔊" : "🔇";
  document.body.classList.toggle("voice-off", !on);
  if(!on && synth){ synth.cancel(); talking(false); }
}
vBtn.onclick = ()=>{ setVoice(!voiceOn); if(voiceOn) speak("Voice is on!"); };
if(!synth){ vBtn.disabled = true; vBtn.title = "Voice is not supported in this browser"; setVoice(false); }

/* ---------- chat ---------- */
const BOT = `<div class="bot small" aria-hidden="true"><div class="face"><span class="eye l"></span><span class="eye r"></span><span class="mouth"></span></div></div>`;
function ai(html, sayText, queue){
  const d = document.createElement("div"); d.className="msg ai";
  const btn = sayText ? `<button class="say" data-say="${esc(sayText)}" aria-label="Listen">🔊</button>` : "";
  d.innerHTML = BOT + `<div class="bubble">${html}${btn}</div>`;
  thread.appendChild(d); thread.scrollTop = thread.scrollHeight;
  if(sayText) speak(sayText, queue);
}
function me(text){
  const d = document.createElement("div"); d.className="msg me";
  d.innerHTML = `<div class="me-av">🧑‍🎓</div><div class="bubble">${esc(text)}</div>`;
  thread.appendChild(d); thread.scrollTop = thread.scrollHeight;
}
function burst(list){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const fx = document.getElementById("fx");
  for(let i=0;i<(list?40:14);i++){
    const s=document.createElement("span"); s.textContent = pick(list||["✨","🎉","💜","⭐"]);
    s.style.left = Math.random()*100+"vw"; s.style.animationDuration = (1.6+Math.random()*1.6)+"s";
    s.style.animationDelay = Math.random()*.4+"s"; fx.appendChild(s); setTimeout(()=>s.remove(),3800);
  }
}
const stars = n => n===null ? "" : "⭐".repeat(n)+"☆".repeat(3-n);

function renderMissions(){
  const done = Object.values(best).reduce((a,b)=>a+b,0);
  const total = MISSIONS.reduce((a,m)=>a+m.total,0);
  document.getElementById("missions").innerHTML = MISSIONS.map(m=>`
    <button class="mission ${mission===m.id?'active':''}" data-m="${m.id}">
      <span class="sticker" style="background:${m.color}">${m.emoji}</span>
      <span><span class="t">${m.t}</span><span class="d">${m.d}</span></span>
      <span class="stars" aria-label="${score[m.id]??0} stars">${stars(score[m.id])}</span>
    </button>`).join("") + `
    <div class="progress"><div class="lbl"><span>Your progress</span><span>${done} / ${total}</span></div><div class="pbar"><i style="width:${done/total*100}%"></i></div></div>`;
}

/* ---------- missions ---------- */
function start(id){
  mission = id; idx = 0; firstTry = 0; thread.innerHTML = ""; renderMissions();
  const m = MISSIONS.find(x=>x.id===id);
  const intro = {
    match:"Let's match! Tap a blue verb, then its yellow partner.",
    gaps:"Let's complete sentences from the talk. Choose the missing words.",
    fix:"Bug hunt! Each sentence has one wrong verb. Pick the right one.",
    define:"I'll describe a collocation. You choose which one I mean."
  }[id];
  ai(`<span class="tag">${m.emoji} ${m.t}</span><br>${intro}`, intro);
  id==="match" ? matchBoard() : ask();
}

/* match */
let selVerb = null, matched = new Set(), nouns = [];
function matchBoard(){
  selVerb = null; matched = new Set(); nouns = shuffle(PAIRS.map(p=>p[1])); missed=false;
  drawMatch();
}
function drawMatch(){
  dock.innerHTML = `<div class="hint">Tap a verb, then its partner 👇</div><div class="cols">
    <div><div class="glabel">💙 Verbs</div><div class="opts">${PAIRS.map((p,i)=>`<button class="opt v ${matched.has(i)?'done':''} ${selVerb===i?'sel':''}" data-verb="${i}" ${matched.has(i)?'disabled':''}>${p[0]}</button>`).join("")}</div></div>
    <div><div class="glabel">💛 Partners</div><div class="opts">${nouns.map(n=>{ const used=[...matched].some(i=>PAIRS[i][1]===n); return `<button class="opt n ${used?'done':''}" data-noun="${esc(n)}" ${used?'disabled':''}>${EMO[n]} ${esc(n)}</button>`;}).join("")}</div></div></div>`;
}
function tryPair(noun, btn){
  if(selVerb===null){ ai("First tap a blue verb 💙","First tap a verb"); return; }
  const v = PAIRS[selVerb][0];
  let ok = PAIRS[selVerb][1]===noun;
  if(!ok && v==="take"){ const j = PAIRS.findIndex((p,k)=>p[0]==="take" && p[1]===noun && !matched.has(k)); if(j>=0){ selVerb=j; ok=true; } }
  me(`${v} + ${noun}`);
  if(ok){
    matched.add(selVerb); firstTry += missed?0:1; missed=false;
    ai(`${pick(PRAISE)} <b>${v} ${esc(noun)}</b> ${EMO[noun]}`, `${v} ${noun}`); burst();
    selVerb = null; drawMatch();
    if(matched.size===PAIRS.length) finish();
  } else {
    missed = true; ai(pick(OOPS), "Not quite. Try again!");
    btn.classList.add("shake"); setTimeout(()=>btn.classList.remove("shake"),400);
  }
}

/* question missions */
function data(){ return {gaps:GAPS,fix:FIX,define:DEF}[mission]; }
function ask(){
  const q = data()[idx]; missed=false;
  const n = `<span class="tag">${idx+1} / ${data().length}</span><br>`;
  if(mission==="gaps") ai(n+`<span class="big">${esc(q.pre)}<span class="gap">?</span>${esc(q.post)}</span>`, (q.pre+" blank "+q.post));
  if(mission==="fix") ai(n+`<span class="big">${esc(q.pre)}<span class="bug">${esc(q.bug)}</span>${esc(q.post)}</span>`, "Which verb should replace "+q.bug+"?");
  if(mission==="define") ai(n+`<span class="big">“${esc(q.def)}”</span>`, q.def);
  dock.innerHTML = `<div class="hint">Choose your answer 👇</div><div class="opts">${shuffle(q.opts).map(o=>`<button class="opt" data-ans="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
}
function answer(o, btn){
  const q = data()[idx]; me(o);
  if(o===q.ans){
    if(!missed) firstTry++;
    let full, html;
    if(mission==="gaps"){ full=q.pre+o+q.post; html=`${esc(q.pre)}<span class="fixed">${esc(o)}</span>${esc(q.post)}`; }
    if(mission==="fix"){ full=q.pre+o+q.post; html=`${esc(q.pre)}<span class="fixed">${esc(o)}</span>${esc(q.post)}`; }
    if(mission==="define"){ full=o; html=`<span class="fixed">${esc(o)}</span>`; }
    ai(`${pick(PRAISE)}<br><span class="big">${html}</span>`, full); burst();
    idx++;
    dock.innerHTML = idx<data().length
      ? `<button class="next" id="nextQ">Next question ➜</button>`
      : `<button class="next" id="nextQ">See my result 🏁</button>`;
    document.getElementById("nextQ").focus();
  } else {
    missed = true; btn.disabled = true; btn.classList.add("shake");
    ai(pick(OOPS), "Not quite. Try again!");
  }
}

function finish(){
  const m = MISSIONS.find(x=>x.id===mission);
  const pct = firstTry/m.total;
  const s = pct===1?3:pct>=.66?2:1;
  score[mission] = Math.max(score[mission]??0, s);
  best[mission] = m.total;
  renderMissions();
  ai(`<span class="big">Mission complete! ${"⭐".repeat(s)}</span><br>${firstTry} of ${m.total} right on the first try.`, `Mission complete! ${firstTry} of ${m.total} on the first try.`, true);
  const next = MISSIONS.find(x=>score[x.id]===null);
  if(next){
    dock.innerHTML = `<button class="next" data-m="${next.id}">Next: ${next.emoji} ${next.t} ➜</button> <button class="opt" data-m="${mission}">Try again 🔁</button>`;
  } else {
    burst(["🎉","🤖","🧠","⭐","🚀","💜","✨"]);
    ai(`<span class="big">You finished every mission! 🏆</span><br>You can now talk about the future of AI like a pro.`, "You finished every mission! Amazing work!", true);
    dock.innerHTML = MISSIONS.map(x=>`<button class="opt" data-m="${x.id}">${x.emoji} ${x.t}</button>`).join(" ");
  }
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const s = e.target.closest(".say"); if(s){ speak(s.dataset.say); return; }
  const m = e.target.closest("[data-m]"); if(m){ start(m.dataset.m); return; }
  const v = e.target.closest("[data-verb]");
  if(v){ selVerb = +v.dataset.verb; speak(PAIRS[selVerb][0]); drawMatch(); return; }
  const n = e.target.closest("[data-noun]"); if(n){ tryPair(n.dataset.noun, n); return; }
  const a = e.target.closest("[data-ans]"); if(a){ answer(a.dataset.ans, a); return; }
  if(e.target.id==="nextQ"){ idx<data().length ? ask() : finish(); }
});

/* welcome */
renderMissions();
ai(`Hi! I'm <b>Nova</b> 👋 I'll help you practise collocations about AI from Nick Bostrom's talk.`, "Hi! I'm Nova. Let's practise collocations about AI.");
ai(`Pick a mission on the left, or start here 👇`);
dock.innerHTML = MISSIONS.map(x=>`<button class="opt" data-m="${x.id}">${x.emoji} ${x.t}</button>`).join(" ");
</script>
